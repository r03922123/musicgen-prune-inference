<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="780" height="290" fill="#fff"/>
  <!-- rows: x(year) = 170 + (year - 2017) * 64 -->
  <g stroke="#d1d9e0" stroke-width="1">
    <line x1="160" x2="770" y1="75" y2="75"/>
    <line x1="160" x2="770" y1="145" y2="145"/>
    <line x1="160" x2="770" y1="215" y2="215"/>
  </g>
  <g fill="#111">
    <text x="10" y="72" font-weight="bold">Sounds like real music?</text>
    <text x="10" y="88" fill="#59636e" font-size="11">needs reference audio</text>
    <text x="10" y="142" font-weight="bold">Matches the text?</text>
    <text x="10" y="158" fill="#59636e" font-size="11">per clip: can pick a take</text>
    <text x="10" y="212" font-weight="bold">Do people like it?</text>
    <text x="10" y="228" fill="#59636e" font-size="11">per clip: can pick a take</text>
  </g>
  <!-- MusicGen's standard report -->
  <line x1="570" x2="570" y1="44" y2="245" stroke="#e45756" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="570" y="36" text-anchor="middle" fill="#e45756" font-weight="bold">MusicGen (2023) reports all three</text>
  <!-- year axis -->
  <g stroke="#555" stroke-width="1">
    <line x1="160" x2="770" y1="248" y2="248"/>
  </g>
  <g fill="#59636e" font-size="11" text-anchor="middle">
    <text x="170" y="263">2017</text><text x="298" y="263">2019</text><text x="426" y="263">2021</text>
    <text x="554" y="263">2023</text><text x="682" y="263">2025</text>
  </g>
  <g stroke="#555" stroke-width="1">
    <line x1="170" x2="170" y1="248" y2="252"/><line x1="234" x2="234" y1="248" y2="252"/>
    <line x1="298" x2="298" y1="248" y2="252"/><line x1="362" x2="362" y1="248" y2="252"/>
    <line x1="426" x2="426" y1="248" y2="252"/><line x1="490" x2="490" y1="248" y2="252"/>
    <line x1="554" x2="554" y1="248" y2="252"/><line x1="618" x2="618" y1="248" y2="252"/>
    <line x1="682" x2="682" y1="248" y2="252"/><line x1="746" x2="746" y1="248" y2="252"/>
  </g>
  <!-- markers: hollow = images, filled = audio or music, diamond = also used to pick the best of N -->
  <g stroke="#4c78a8" stroke-width="2">
    <circle cx="202" cy="75" r="6" fill="#fff"/>
    <circle cx="298" cy="75" r="6" fill="#4c78a8"/>
    <circle cx="570" cy="75" r="6" fill="#4c78a8"/>
    <circle cx="633" cy="75" r="6" fill="#4c78a8"/>
    <path d="M433,137 L441,145 L433,153 L425,145 z" fill="#fff"/>
    <path d="M556,137 L564,145 L556,153 L548,145 z" fill="#4c78a8"/>
    <circle cx="576" cy="145" r="6" fill="#4c78a8"/>
    <circle cx="570" cy="215" r="6" fill="#4c78a8"/>
    <circle cx="690" cy="215" r="6" fill="#4c78a8"/>
    <path d="M756,207 L764,215 L756,223 L748,215 z" fill="#4c78a8"/>
  </g>
  <g fill="#111" font-size="11">
    <text x="202" y="62" text-anchor="middle">FID (images)</text>
    <text x="298" y="62" text-anchor="middle">FAD</text>
    <text x="562" y="96" text-anchor="end">FAD, KL</text>
    <text x="633" y="62" text-anchor="middle">FAD for music</text>
    <text x="433" y="130" text-anchor="middle">CLIP score; DALL·E picks with it</text>
    <text x="548" y="168" text-anchor="end">AudioLDM picks with CLAP</text>
    <text x="584" y="130" text-anchor="start">CLAP score</text>
    <text x="562" y="236" text-anchor="end">human ratings</text>
    <text x="690" y="202" text-anchor="middle">Audiobox Aesthetics</text>
    <text x="770" y="240" text-anchor="end">CMI-RM, top-k</text>
  </g>
  <!-- legend -->
  <g font-size="11" fill="#59636e">
    <circle cx="176" cy="281" r="5" fill="#fff" stroke="#4c78a8" stroke-width="2"/><text x="186" y="285">images</text>
    <circle cx="246" cy="281" r="5" fill="#4c78a8" stroke="#4c78a8" stroke-width="2"/><text x="256" y="285">audio or music</text>
    <path d="M356,275 L362,281 L356,287 L350,281 z" fill="#4c78a8" stroke="#4c78a8" stroke-width="1.5"/>
    <text x="368" y="285">also used to pick the best of N takes</text>
  </g>
</svg>
