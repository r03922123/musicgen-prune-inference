[project]
name = "musicgen-prune-mlx"
version = "0.1.0"
description = "Best-of-N MusicGen with checkpoint pruning in MLX: where does the speedup come from?"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.32.0",
    "mlx>=0.32.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
