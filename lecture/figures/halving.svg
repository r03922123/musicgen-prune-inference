<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="780" height="300" fill="#fff"/>
  <!-- time axis: x = 70 + 18 px per second, 0..30 s -> 70..610 -->
  <g stroke="#bbb" stroke-dasharray="4 3">
    <line x1="250" y1="22" x2="250" y2="262"/><line x1="430" y1="22" x2="430" y2="262"/>
  </g>
  <g text-anchor="middle" fill="#b4580f">
    <text x="250" y="16">checkpoint 10 s: keep 4</text><text x="430" y="16">checkpoint 20 s: keep 2</text>
  </g>
  <g text-anchor="end" fill="#333">
    <text x="62" y="42">take A</text><text x="62" y="70">take B</text><text x="62" y="98">take C</text><text x="62" y="126">take D</text>
    <text x="62" y="154">take E</text><text x="62" y="182">take F</text><text x="62" y="210">take G</text><text x="62" y="238">take H</text>
  </g>
  <!-- bars: y top = 29 + 28*i, height 18 -->
  <g>
    <rect x="70" y="29"  width="540" height="18" rx="3" fill="#4c78a8"/>
    <rect x="70" y="57"  width="360" height="18" rx="3" fill="#4c78a8" opacity=".75"/>
    <rect x="70" y="85"  width="180" height="18" rx="3" fill="#4c78a8" opacity=".5"/>
    <rect x="70" y="113" width="540" height="18" rx="3" fill="#4c78a8"/>
    <rect x="70" y="141" width="180" height="18" rx="3" fill="#4c78a8" opacity=".5"/>
    <rect x="70" y="169" width="360" height="18" rx="3" fill="#4c78a8" opacity=".75"/>
    <rect x="70" y="197" width="180" height="18" rx="3" fill="#4c78a8" opacity=".5"/>
    <rect x="70" y="225" width="180" height="18" rx="3" fill="#4c78a8" opacity=".5"/>
  </g>
  <g fill="#c0392b" font-size="14" text-anchor="middle">
    <text x="262" y="99">✕</text><text x="262" y="155">✕</text><text x="262" y="211">✕</text><text x="262" y="239">✕</text>
    <text x="442" y="71">✕</text><text x="442" y="183">✕</text>
  </g>
  <g fill="#333"><text x="618" y="42">→ finalist</text><text x="618" y="126">→ finalist</text></g>
  <!-- axis -->
  <line x1="70" y1="262" x2="610" y2="262" stroke="#555"/>
  <g text-anchor="middle" fill="#555"><text x="70" y="278">0 s</text><text x="250" y="278">10 s</text><text x="430" y="278">20 s</text><text x="610" y="278">30 s</text></g>
  <text x="340" y="296" text-anchor="middle" fill="#333">generated: 8·10 + 4·10 + 2·10 = 140 take-seconds of 8·30 = 240  →  compute 0.583</text>
</svg>
